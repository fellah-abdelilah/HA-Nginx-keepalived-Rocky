global_defs {
    router_id srv1
}

vrrp_script chk_nginx {
    script "/usr/bin/pidof nginx"
    interval 2
    weight -20
}

vrrp_instance VI_1 {
    state MASTER
    interface ens33
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass rocky123
    }

    virtual_ipaddress {
        192.168.150.200
    }

    track_script {
        chk_nginx
    }
}